name: Build iLiDAR

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Version prefix (e.g. 1.0)"
        required: false
        default: "1.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod install
        run: pod install

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -workspace iLiDAR.xcworkspace \
            -scheme iLiDAR \
            -configuration Release \
            -archivePath build/iLiDAR.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.example.ilidar

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/iLiDAR.xcarchive/Products/Applications/iLiDAR.app" build/ipa/Payload/
          cd build/ipa && zip -qry iLiDAR.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iLiDAR.ipa
          path: build/ipa/*.ipa   
